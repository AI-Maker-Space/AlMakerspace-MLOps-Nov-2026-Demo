<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The same seven pages, plus the index that makes them a wiki</title>
<desc id="desc">The same seven files, now with stable names, headings and an index page, data/wiki/index.md, that lists one row per page saying what it is for, with navigation hints, kept current by Knowledge Operations. Notebook 02 gives the agent three tools: list_pages returns the index, grep_wiki returns matching lines with page and line number, read_page returns one whole page by name. The agent reads the index, picks a page by name and reads it whole. The cost is that somebody keeps index.md true. The same question, model, system prompt, agent class and budget are fixed.</desc>
