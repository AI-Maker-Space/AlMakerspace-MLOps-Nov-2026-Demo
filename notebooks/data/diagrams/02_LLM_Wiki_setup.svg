<rect class="bg" x="0" y="0" width="960" height="470" rx="16"/>
<text class="title" x="32" y="40">The same seven pages, plus the index that makes them a wiki</text>

<text class="subtitle" x="32" y="62">Stable names, headings, and an index page a person maintains. That is what makes seven files a wiki an agent can navigate.</text>
<rect class="zone-plain" x="32" y="84" width="332" height="306" rx="14"/>
<text class="tiny" x="48" y="108" letter-spacing="1.5" font-weight="700">THE SAME 7 FILES   ·   stable names   ·   ## headings</text>
<rect class="node" x="48" y="122" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="136.5">field_guide</text>
<text class="tiny" x="58" y="149">company facts, regions, services</text>
<rect class="node" x="48" y="158" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="172.5">glossary</text>
<text class="tiny" x="58" y="185">acronyms, status codes, identifiers</text>
<rect class="node-accent" x="48" y="194" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="208.5">tariffs_and_slas</text>
<text class="tiny" x="58" y="221">pricing, minimum terms, credits</text>
<rect class="node" x="48" y="230" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="244.5">fault_runbook</text>
<text class="tiny" x="58" y="257">fault stages, line test, truck roll</text>
<rect class="node" x="48" y="266" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="280.5">data_handling</text>
<text class="tiny" x="58" y="293">access, retention, legal hold</text>
<rect class="node" x="48" y="302" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="316.5">network_operations</text>
<text class="tiny" x="58" y="329">NOC, latency objectives, cache</text>
<rect class="node" x="48" y="338" width="300" height="32" rx="8"/>
<text class="mono" x="58" y="352.5">quarterly_metrics.csv</text>
<text class="tiny" x="58" y="365">tickets, latency, churn, NPS</text>
<rect class="node-accent" x="420" y="100" width="300" height="196" rx="12"/>
<text class="tiny t-accent" x="436" y="124" letter-spacing="1.5" font-weight="700">DATA/WIKI/INDEX.MD   ·   WIKI_INDEX</text>
<text class="mono" x="436" y="148">| Page | Use it for |</text>
<text class="mono" x="436" y="166">| glossary | codes, identifiers |</text>
<text class="mono" x="436" y="184">| tariffs_and_slas | pricing, terms |</text>
<text class="mono" x="436" y="202">| fault_runbook | fault stages … |</text>
<text class="small" x="436" y="228">Suggested navigation:</text>
<text class="small" x="436" y="245">– resolve a code in the glossary, then follow it</text>
<text class="small" x="436" y="262">– for tariffs, read the page, don't search numbers</text>
<text class="tiny t-accent" x="436" y="284">one row per page · kept current by a person, not a model</text>
<path class="edge-accent" d="M418,208 L366,208" marker-end="url(#arrow-accent)"/>
<text class="tiny" x="392" y="200" text-anchor="middle">names</text>

<rect class="zone" x="420" y="312" width="300" height="86" rx="12"/>
<text class="tiny" x="436" y="334" letter-spacing="1.5" font-weight="700">THE QUESTION</text>
<text class="label" x="436" y="356">Which plan costs forty-five pounds a</text>
<text class="label" x="436" y="374">month, and how long am I tied in for?</text>

<rect class="node-accent" x="760" y="100" width="168" height="298" rx="12"/>
<text class="tiny t-accent" x="776" y="124" letter-spacing="1.5" font-weight="700">NOTEBOOK 02</text>
<text class="label" x="776" y="148">three tools</text>
<text class="label mono" x="776" y="172">list_pages<tspan class="t-accent">()</tspan></text>
<text class="small" x="776" y="189">the index, as text</text>
<text class="label mono" x="776" y="216">grep_wiki<tspan class="t-accent">(pattern)</tspan></text>
<text class="small" x="776" y="233">page:line: text</text>
<text class="label mono" x="776" y="260">read_page<tspan class="t-accent">(page)</tspan></text>
<text class="small" x="776" y="277">one whole page</text>
<text class="tiny" x="776" y="306">the agent reads the index,</text>
<text class="tiny" x="776" y="321">picks a page by name,</text>
<text class="tiny" x="776" y="336">reads it whole</text>
<text class="tiny" x="776" y="364">cost: somebody keeps</text>
<text class="tiny" x="776" y="379">index.md true</text>
<rect class="node-soft" x="32" y="414" width="896" height="40" rx="12"/>
<text class="small" x="48" y="439">Fixed for both notebooks: <tspan class="mono">LLM_MODEL</tspan> from <tspan class="mono">.env</tspan> · one system prompt · <tspan class="mono">FunctionAgent</tspan> · a budget of six model calls · the same question</text>

