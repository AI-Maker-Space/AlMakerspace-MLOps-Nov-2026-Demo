</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="460" rx="16"/>

<text class="title" x="32" y="40">Four of the six chart numbers exist only as pixels</text>
<text class="subtitle" x="32" y="62">Memos load as text. Charts must load as ImageDocuments, or a text embedder indexes them without seeing them.</text>

<!-- text/ -->
<rect class="node" x="32" y="88" width="448" height="108" rx="14"/>
<text x="50" y="114"><tspan class="label mono">text/</tspan><tspan class="small">   6 memos, Markdown</tspan></text>
<text class="mono" x="50" y="142">doc_customer_sentiment.md</text>
<text class="mono" x="50" y="162">doc_network_reliability.md</text>
<text class="mono" x="50" y="182">doc_ops_review_notes.md</text>
<text class="mono" x="266" y="142">doc_retention_programme.md</text>
<text class="mono" x="266" y="162">doc_root_cause_review.md</text>
<text class="mono" x="266" y="182">doc_support_team.md</text>

