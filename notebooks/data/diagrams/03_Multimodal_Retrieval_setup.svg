<!-- loaders -->
<rect class="node" x="520" y="112" width="232" height="60" rx="10"/>
<text class="label mono" x="636" y="137" text-anchor="middle">SimpleDirectoryReader</text>
<text class="mono t-muted" x="636" y="157" text-anchor="middle">file_metadata=file_name_only</text>
<line class="edge" x1="480" y1="142" x2="518" y2="142" marker-end="url(#arrow)"/>
<text class="tiny" x="500" y="134" text-anchor="middle">reads</text>
<rect class="node-accent" x="520" y="294" width="232" height="60" rx="10"/>
<text class="label mono" x="636" y="319" text-anchor="middle">ImageDocument</text>
<text class="mono t-accent" x="636" y="339" text-anchor="middle">image_path=str(path)</text>
<line class="edge-accent" x1="480" y1="324" x2="518" y2="324" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="500" y="316" text-anchor="middle" font-weight="700">wraps</text>

<!-- the trap -->
<path class="edge-warn dashed" d="M480,250 C520,250 548,200 556,176" marker-end="url(#arrow-warn)"/>
<line class="edge-warn" x1="509" y1="236" x2="521" y2="248" stroke-width="2.5"/>
<line class="edge-warn" x1="521" y1="236" x2="509" y2="248" stroke-width="2.5"/>
<text class="small t-warn" x="576" y="202" font-weight="600">PNGs through this reader</text>
<text class="small t-warn" x="576" y="218" font-weight="600">come back as plain Documents.</text>
<text class="small" x="576" y="234">A text embedder indexes them</text>
<text class="small" x="576" y="250">without seeing the picture.</text>

