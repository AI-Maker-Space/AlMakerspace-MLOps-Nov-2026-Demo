<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Four of the six chart numbers exist only as pixels</title>
<desc id="desc">The corpus has two folders. text/ holds six Markdown memos, loaded by SimpleDirectoryReader as six Documents. images/ holds six charts, wrapped as six ImageDocuments. Together they are twelve records. Four charts carry a number that no memo mentions: churn peaking at 6.2% in March, Coast latency of 240 ms, customer equipment at 55% of tickets, and Q4 tickets at 27 thousand. Headcount and NPS also appear in a memo. Pointing SimpleDirectoryReader at the PNGs would return plain Documents that a text embedder indexes without seeing the picture.</desc>
<style>
