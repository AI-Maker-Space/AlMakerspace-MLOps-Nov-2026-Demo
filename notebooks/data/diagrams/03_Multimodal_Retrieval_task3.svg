<rect class="node" x="48" y="118" width="64" height="30" rx="6"/><text class="tiny" x="80" y="137" text-anchor="middle">0–6 s</text><rect class="node" x="116" y="118" width="110" height="30" rx="6"/><text class="tiny" x="171" y="137" text-anchor="middle">6–16 s</text><rect class="node" x="230" y="118" width="110" height="30" rx="6"/><text class="tiny" x="285" y="137" text-anchor="middle">16–26 s</text><rect class="node-accent" x="344" y="118" width="121" height="30" rx="6"/><text class="tiny" x="404" y="137" text-anchor="middle">26–37 s</text><rect class="node" x="469" y="118" width="87" height="30" rx="6"/><text class="tiny" x="512" y="137" text-anchor="middle">37–45 s</text>
