<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Video is the same two stores, keyed by time</title>
<desc id="desc">A 45-second review video is split into five timestamped transcript segments with one keyframe each. Each segment becomes two records with the same file_name, for example review.mp4 at 26 to 37 seconds: the transcript text goes through bge-small into a video_transcript store, and the keyframe goes through CLIP into a video_frames store. The pipeline on the right is unchanged from Tasks 1 and 2: MultiModalVectorStoreIndex over both stores, QueryFusionRetriever with reciprocal rank fusion, and answer with text and pixels in one message. The citation that comes back is a timestamp.</desc>
