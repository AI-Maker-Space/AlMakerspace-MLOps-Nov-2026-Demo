<text class="small" x="440" y="308">the latency chart</text>
<text class="tiny t-accent" x="344" y="336">ImageDocument → CLIP → video_frames</text>
<text class="tiny" x="48" y="366">both records carry the same name, so whichever store finds the moment, the citation is the moment</text>
<text class="tiny" x="48" y="384">Nadia's calls: a transcript per call, chunked by time window; one frame per window; a timestamp per citation</text>
