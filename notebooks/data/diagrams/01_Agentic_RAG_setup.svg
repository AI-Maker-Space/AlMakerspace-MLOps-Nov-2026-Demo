<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Seven pages, and a question that shares no words with its answer</title>
<desc id="desc">Seven Northline Broadband files are loaded as pages. The question, which plan costs forty-five pounds a month and how long am I tied in for, has its answer in section 3 of the tariffs page, which says the monthly charge is £45 and the minimum term is 24 months, but shares no words with it. Notebook 01 gives the agent one tool, search_chunks, which returns ranked sections by shared words; the agent never sees a page name or an index. The model, system prompt, agent class, budget and question are fixed for both notebooks.</desc>
