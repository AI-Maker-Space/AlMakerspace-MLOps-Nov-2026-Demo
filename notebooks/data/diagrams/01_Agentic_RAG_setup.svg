<text class="tiny" x="580" y="204">has to reach</text>

<rect class="node-good" x="420" y="218" width="300" height="104" rx="12"/>
<text class="tiny" x="436" y="240" letter-spacing="1.5" font-weight="700">THE ANSWER · tariffs_and_slas, section 3</text>
<text class="mono" x="436" y="262">## Fibre 500 Home (NL-F500-24)</text>
<text class="small" x="436" y="280">The monthly charge is <tspan class="t-good" font-weight="600">£45</tspan> per month … The</text>
<text class="small" x="436" y="297"><tspan class="t-good" font-weight="600">minimum term</tspan> is <tspan class="t-good" font-weight="600">24 months</tspan>.</text>
<text class="tiny" x="436" y="314">no word in common with the question</text>

<path class="edge dashed" d="M364,208 L418,208"/>
<text class="tiny" x="391" y="200" text-anchor="middle">lives in</text>
