<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">The loop runs until the model answers or the budget runs out</title>
<desc id="desc">run_agent starts a timer and calls agent.run(question, max_iterations=6). The model either asks for a tool or answers. A tool call runs the tool and sends its result string back to the model. Each ToolCallResult event from handler.stream_events() adds a row to the trace: tool name, arguments, characters returned. The run ends with stopped set to answer when the model answers without a tool, or max_turns when WorkflowRuntimeError is raised because the six model calls are spent. run_agent returns the answer, the trace, the evidence characters, the latency and how it stopped.</desc>
<style>
  .bg{fill:#FBFAF7}
  .frame{fill:none;stroke:#E4E1DA;stroke-width:1}
  .node{fill:#FFFFFF;stroke:#CBD2DA;stroke-width:1.25}
  .node-soft{fill:#F2F1EC;stroke:none}
  .node-accent{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.75}
  .node-good{fill:#EAF7EE;stroke:#2F9E44;stroke-width:1.5}
  .node-warn{fill:#FFF1E8;stroke:#D9480F;stroke-width:1.5}
  .zone{fill:#F4F5FF;stroke:#4F46E5;stroke-width:1.5;stroke-dasharray:6 4}
  .zone-plain{fill:none;stroke:#AEB6C0;stroke-width:1.25;stroke-dasharray:4 4}
  .zone-warn{fill:#FFF6F0;stroke:#D9480F;stroke-width:1.5;stroke-dasharray:6 4}
  .bar{fill:#B9C0FF}
  .bar-accent{fill:#4F46E5}
  .bar-muted{fill:#D5D9DE}
  .bar-good{fill:#2F9E44}
  .bar-warn{fill:#D9480F}
  .edge{fill:none;stroke:#7D8794;stroke-width:1.5}
  .edge-accent{fill:none;stroke:#4F46E5;stroke-width:2}
  .edge-good{fill:none;stroke:#2F9E44;stroke-width:2}
  .edge-warn{fill:none;stroke:#D9480F;stroke-width:2}
  .dashed{stroke-dasharray:5 4}
  .rule{fill:none;stroke:#E4E1DA;stroke-width:1}
  .head{fill:#7D8794}
  .head-accent{fill:#4F46E5}
  .head-good{fill:#2F9E44}
  .head-warn{fill:#D9480F}
  text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;fill:#1F2328;font-size:13px}
  .title{font-size:17px;font-weight:650}
  .subtitle{font-size:13px;fill:#5B6470}
  .label{font-size:13px;font-weight:600}
  .small{font-size:11.5px;fill:#5B6470}
  .tiny{font-size:10.5px;fill:#5B6470}
  .mono{font-family:Consolas,"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12px}
  .t-accent{fill:#4F46E5}
  .t-good{fill:#2F9E44}
  .t-warn{fill:#D9480F}
  .t-muted{fill:#5B6470}
  .t-inv{fill:#FFFFFF}
  .chip{fill:#4F46E5}
  .chip-warn{fill:#D9480F}
  .chip-good{fill:#2F9E44}
  .chip-muted{fill:#5B6470}
  @media (prefers-color-scheme:dark){
    .bg{fill:#15171C}
    .frame{stroke:#2A2E36}
    .node{fill:#1D2027;stroke:#3A414C}
    .node-soft{fill:#22262E}
    .node-accent{fill:#23264A;stroke:#8E8CFF}
    .node-good{fill:#183224;stroke:#5FD07A}
    .node-warn{fill:#3A2116;stroke:#FF8A4C}
    .zone{fill:#1A1C33;stroke:#8E8CFF}
    .zone-plain{stroke:#58606C}
    .zone-warn{fill:#2A1A13;stroke:#FF8A4C}
    .bar{fill:#4B4F9E}
    .bar-accent{fill:#8E8CFF}
    .bar-muted{fill:#3A414C}
    .bar-good{fill:#5FD07A}
    .bar-warn{fill:#FF8A4C}
    .edge{stroke:#8892A0}
    .edge-accent{stroke:#8E8CFF}
    .edge-good{stroke:#5FD07A}
    .edge-warn{stroke:#FF8A4C}
    .rule{stroke:#2A2E36}
    .head{fill:#8892A0}
    .head-accent{fill:#8E8CFF}
    .head-good{fill:#5FD07A}
    .head-warn{fill:#FF8A4C}
    text{fill:#E6E8EB}
    .subtitle,.small,.tiny,.t-muted{fill:#9AA4AF}
    .t-accent{fill:#A5A3FF}
    .t-good{fill:#5FD07A}
    .t-warn{fill:#FF8A4C}
    .t-inv{fill:#15171C}
    .chip{fill:#8E8CFF}
    .chip-warn{fill:#FF8A4C}
    .chip-good{fill:#5FD07A}
    .chip-muted{fill:#9AA4AF}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="456" rx="16"/>

<text class="title" x="32" y="40">The loop runs until the model answers or the budget runs out</text>
<text class="subtitle" x="32" y="62">Every ToolCallResult on the way is copied into the trace: which tool, what arguments, how many characters came back.</text>

<!-- one timed run -->
<rect class="zone-plain" x="32" y="88" width="552" height="336" rx="14"/>
<text class="tiny" x="50" y="114" letter-spacing="1.5" font-weight="700">ONE RUN</text>
<text class="mono" x="116" y="114">run_agent(question, agent)</text>
<text class="mono t-muted" x="566" y="114" text-anchor="end">started = time.perf_counter()</text>
<text class="mono t-muted" x="566" y="410" text-anchor="end">latency_s = time.perf_counter() - started</text>
<rect class="node" x="64" y="128" width="320" height="40" rx="10"/>
<text class="label mono" x="224" y="152.5" text-anchor="middle">agent.run(question, max_iterations=6)</text>
<rect class="node" x="64" y="204" width="160" height="64" rx="10"/>
<text class="label" x="144" y="232" text-anchor="middle">model</text>
<text class="small" x="144" y="251" text-anchor="middle">LLM, via LiteLLM</text>
<rect class="node" x="400" y="204" width="160" height="64" rx="10"/>
<text class="label" x="480" y="232" text-anchor="middle">tool</text>
<text class="small" x="480" y="251" text-anchor="middle">from the tools= list</text>
<line class="edge" x1="144" y1="168" x2="144" y2="202" marker-end="url(#arrow)"/>
<text class="tiny" x="152" y="188">question + tool schemas</text>
<line class="edge" x1="224" y1="222" x2="398" y2="222" marker-end="url(#arrow)"/>
<text class="tiny" x="312" y="214" text-anchor="middle">tool call: name and arguments</text>
<line class="edge" x1="400" y1="250" x2="226" y2="250" marker-end="url(#arrow)"/>
<text class="tiny" x="280" y="266" text-anchor="middle">result: one string</text>
<circle class="node-accent" cx="376" cy="250" r="5"/>
<path class="edge-accent dashed" d="M376,256 L376,300 L614,300" marker-end="url(#arrow-accent)"/>
<text class="mono t-accent" x="576" y="292" text-anchor="end" font-weight="600">ToolCallResult</text>
<text class="tiny" x="576" y="316" text-anchor="end">from handler.stream_events()</text>

<!-- how a run stops -->
<rect class="node-good" x="64" y="340" width="160" height="48" rx="10"/>
<text class="label mono" x="144" y="361" text-anchor="middle">stopped=&quot;answer&quot;</text>
<text class="small" x="144" y="378" text-anchor="middle">no tool call: it answered</text>
<line class="edge-good" x1="104" y1="268" x2="104" y2="338" marker-end="url(#arrow-good)"/>
<rect class="node-warn" x="256" y="340" width="192" height="48" rx="10"/>
<text class="label mono" x="352" y="361" text-anchor="middle">stopped=&quot;max_turns&quot;</text>
<text class="mono t-warn" x="352" y="378" text-anchor="middle">WorkflowRuntimeError</text>
<path class="edge-warn" d="M184,268 L184,312 Q184,320 192,320 L344,320 Q352,320 352,328 L352,338" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="268" y="312" text-anchor="middle" font-weight="700">all 6 model calls spent</text>

<!-- the trace -->
<rect class="zone" x="616" y="88" width="312" height="336" rx="14"/>
<text class="tiny t-accent" x="634" y="114" letter-spacing="1.5" font-weight="700">THE TRACE</text>
<text class="tiny" x="634" y="134">one row per ToolCallResult</text>
<text class="tiny" x="634" y="148">illustrative calls; sizes vary by run</text>
<text class="tiny" x="634" y="170" font-weight="700">tool</text>
<text class="tiny" x="910" y="170" text-anchor="end" font-weight="700">chars</text>
<line class="rule" x1="634" y1="178" x2="910" y2="178"/>
<text class="label mono" x="634" y="200">search_chunks</text>
<text class="mono" x="910" y="200" text-anchor="end">~1,800</text>
<text class="small" x="634" y="218"><tspan class="tiny">args  </tspan>query: "plan costs forty-five pounds a month"</text>
<text class="label mono" x="634" y="250">search_chunks</text>
<text class="mono" x="910" y="250" text-anchor="end">~1,800</text>
<text class="small" x="634" y="268"><tspan class="tiny">args  </tspan>query: "plan costs 45 pounds a month" <tspan class="tiny">(reworded)</tspan></text>
<line class="rule" x1="634" y1="282" x2="910" y2="282"/>
<text class="tiny" x="634" y="308" letter-spacing="1.5" font-weight="700">RUN_AGENT RETURNS</text>
<text class="mono" x="634" y="330">answer</text>
<text class="small" x="766" y="330">the model&#x27;s text</text>
<text class="mono" x="634" y="349">trace</text>
<text class="small" x="766" y="349">the rows above</text>
<text class="mono" x="634" y="368">evidence_chars</text>
<text class="small" x="766" y="368">the sum of chars</text>
<text class="mono" x="634" y="387">latency_s</text>
<text class="small" x="766" y="387">end minus start</text>
<text class="mono" x="634" y="406">stopped</text>
<text class="small" x="766" y="406">&quot;answer&quot; or &quot;max_turns&quot;</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
