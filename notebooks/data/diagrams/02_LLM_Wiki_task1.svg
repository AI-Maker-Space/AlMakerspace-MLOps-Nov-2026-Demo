<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Three plain functions become three tools, and the schema carries the index</title>
<desc id="desc">A FunctionAgent with the same model and system prompt as notebook 01 calls three tools. list_pages returns the wiki index, read from data/wiki/index.md. grep_wiki returns matching lines with page and line number, up to 40, from every line of every page. read_page returns one whole page by name, up to 12,000 characters, from PAGES. The page argument is a Literal of the seven names, which becomes an enum in the schema, so the model cannot ask for a page that does not exist. The tools read the same seven files directly; nothing is indexed.</desc>
