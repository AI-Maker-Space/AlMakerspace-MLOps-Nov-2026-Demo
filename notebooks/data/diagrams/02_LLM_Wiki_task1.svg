<rect class="bg" x="0" y="0" width="960" height="440" rx="16"/>
<text class="title" x="32" y="40">Three plain functions become three tools, and the schema carries the index</text>

<text class="subtitle" x="32" y="62">Every tool starts from a page name, and the index rides inside the schema: the model knows what each page is for before its first call.</text>
