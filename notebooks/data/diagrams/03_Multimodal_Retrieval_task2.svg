<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Retrieval narrows twelve files to three; the vision model reads only those</title>
<desc id="desc">The question goes to the fused retriever, which searches all twelve files and returns three hits. The hits go into one message: the ANSWER_SYSTEM prompt, then the question, each memo as text labelled with its file name, and each chart as its file name followed by the chart&#x27;s pixels as a base64 image part. The vision model reads that one message and answers with file citations, for example Q4 with 27 thousand tickets, citing fig_tickets_quarterly.png. Twelve files are in the corpus and three are in the model&#x27;s input.</desc>
