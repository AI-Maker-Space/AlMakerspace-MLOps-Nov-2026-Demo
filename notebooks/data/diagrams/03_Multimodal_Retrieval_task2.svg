  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="448" rx="16"/>

<text class="title" x="32" y="40">Retrieval narrows twelve files to three; the vision model reads only those</text>
<text class="subtitle" x="32" y="62">Memo text and chart pixels travel in one message, and the answer cites the files it used.</text>

<!-- question -->
<rect class="node-accent" x="32" y="88" width="376" height="56" rx="10"/>
<text class="tiny t-accent" x="48" y="108" letter-spacing="1.5" font-weight="700">THE QUESTION</text>
<text class="small" x="48" y="130" font-weight="600">Which quarter had the most support tickets, and how many?</text>

<!-- the corpus, 12 files -->
<rect class="node" x="32" y="160" width="176" height="216" rx="14"/>
<text x="50" y="186"><tspan class="label">corpus</tspan><tspan class="small">   12 files</tspan></text>
<rect class="node-soft" x="52" y="208" width="40" height="30" rx="6"/>
<text class="tiny" x="72" y="227" text-anchor="middle">memo</text>
<rect class="node-soft" x="100" y="208" width="40" height="30" rx="6"/>
<text class="tiny" x="120" y="227" text-anchor="middle">chart</text>
<rect class="node-accent" x="148" y="208" width="40" height="30" rx="6"/>
<text class="tiny t-accent" x="168" y="227" text-anchor="middle" font-weight="700">memo</text>
<rect class="node-soft" x="52" y="246" width="40" height="30" rx="6"/>
<text class="tiny" x="72" y="265" text-anchor="middle">chart</text>
<rect class="node-soft" x="100" y="246" width="40" height="30" rx="6"/>
<text class="tiny" x="120" y="265" text-anchor="middle">memo</text>
<rect class="node-accent" x="148" y="246" width="40" height="30" rx="6"/>
<text class="tiny t-accent" x="168" y="265" text-anchor="middle" font-weight="700">chart</text>
<rect class="node-soft" x="52" y="284" width="40" height="30" rx="6"/>
<text class="tiny" x="72" y="303" text-anchor="middle">memo</text>
<rect class="node-accent" x="100" y="284" width="40" height="30" rx="6"/>
<text class="tiny t-accent" x="120" y="303" text-anchor="middle" font-weight="700">chart</text>
<rect class="node-soft" x="148" y="284" width="40" height="30" rx="6"/>
<text class="tiny" x="168" y="303" text-anchor="middle">memo</text>
<rect class="node-soft" x="52" y="322" width="40" height="30" rx="6"/>
<text class="tiny" x="72" y="341" text-anchor="middle">chart</text>
<rect class="node-soft" x="100" y="322" width="40" height="30" rx="6"/>
<text class="tiny" x="120" y="341" text-anchor="middle">memo</text>
<rect class="node-soft" x="148" y="322" width="40" height="30" rx="6"/>
<text class="tiny" x="168" y="341" text-anchor="middle">chart</text>
<text class="tiny" x="120" y="364" text-anchor="middle">highlighted: 3 hits (example)</text>

<!-- Strategy C -->
<rect class="node" x="248" y="216" width="160" height="80" rx="10"/>
<text class="label mono" x="328" y="248" text-anchor="middle">retriever</text>
<text class="small" x="328" y="268" text-anchor="middle">two stores, fused top 3</text>
<line class="edge" x1="328" y1="144" x2="328" y2="214" marker-end="url(#arrow)"/>
<line class="edge" x1="208" y1="256" x2="246" y2="256" marker-end="url(#arrow)"/>
<text class="tiny" x="228" y="248" text-anchor="middle">all 12</text>

<!-- one message -->
<rect class="zone" x="456" y="88" width="256" height="256" rx="14"/>
<text class="tiny t-accent" x="472" y="110" letter-spacing="1.5" font-weight="700">ONE MESSAGE</text>
<line class="edge-accent" x1="408" y1="256" x2="454" y2="256" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="432" y="248" text-anchor="middle" font-weight="700">3 hits</text>
<rect class="node" x="470" y="120" width="228" height="40" rx="8"/>
<text class="mono" x="480" y="137">ANSWER_SYSTEM</text>
<text class="small" x="480" y="153">context only; cite files like [file]</text>
<text class="tiny" x="470" y="178" font-weight="700">then the user content, in order</text>
<rect class="node" x="470" y="188" width="228" height="24" rx="6"/>
<text class="small" x="480" y="204">Question: …  --- CONTEXT ---</text>
<rect class="node" x="470" y="218" width="228" height="24" rx="6"/>
<text class="small" x="480" y="234">[a memo hit]: the memo&#x27;s text</text>
<rect class="node" x="470" y="248" width="228" height="24" rx="6"/>
<text class="small" x="480" y="264">[fig_tickets_quarterly.png]:</text>
<rect class="node-accent" x="470" y="278" width="228" height="24" rx="6"/>
<text class="small t-accent" x="480" y="294" font-weight="600">image_url: the chart&#x27;s pixels</text>
<rect class="node" x="470" y="308" width="228" height="24" rx="6"/>
<text class="small" x="480" y="324">[the third hit] …</text>

<!-- the vision model -->
<rect class="node-accent" x="752" y="176" width="176" height="80" rx="10"/>
<text class="label" x="840" y="208" text-anchor="middle">vision model</text>
<text class="mono t-accent" x="840" y="228" text-anchor="middle">VLM_MODEL</text>
<line class="edge-accent" x1="712" y1="216" x2="750" y2="216" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="732" y="208" text-anchor="middle" font-weight="700">reads</text>
<rect class="node-good" x="456" y="368" width="472" height="48" rx="10"/>
<text class="tiny" x="472" y="388" letter-spacing="1.5" font-weight="700">EXAMPLE ANSWER</text>
<text x="472" y="406"><tspan class="small">Q4, with 27 thousand tickets </tspan><tspan class="mono t-good">[fig_tickets_quarterly.png]</tspan></text>
<path class="edge-good" d="M840.0,256 L840.0,366" marker-end="url(#arrow-good)"/>
<text class="tiny" x="848" y="316">answer + citations</text>

<!-- the narrowing -->
<text x="32" y="404"><tspan class="label">12 files</tspan><tspan class="small"> in the corpus,  </tspan><tspan class="label t-accent">3</tspan><tspan class="small"> in the model&#x27;s input.</tspan></text>
<text class="small" x="32" y="422">At nine hundred screenshots: three image reads per query, not 900.</text>
